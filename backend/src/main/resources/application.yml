# ============================================================
#  RentMaster - Application Configuration
# ============================================================

server:
  port: 8080
  servlet:
    context-path: /api/v1

# ---- Datasource (MySQL) ----
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/rentmaster_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # ---- Mail (Gmail SMTP) ----
  mail:
    host: smtp.gmail.com
    port: 587
    username: your-email@gmail.com
    password: your-app-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# ---- JWT ----
jwt:
  secret-key: VGhpc0lzQVN1cGVyU2VjcmV0S2V5Rm9yUmVudE1hc3RlckFwcDEyMzQ1Njc4OTA=
  expiration: 86400000
